---
- name: Kernel revert
  hosts: all
  gather_facts: true
  become: true

  vars:
    remote_script_dir: /opt/kernel-migration
    mgn_state_file: /var/lib/kernel-migration/state.env

  tasks:
    - name: Skip non-Linux hosts
      ansible.builtin.meta: end_host
      when: ansible_system == 'Win32NT'

    - name: Check for kernel-migration state file
      ansible.builtin.stat:
        path: "{{ mgn_state_file }}"
      register: mgn_state_stat

    - name: Skip hosts with no downgrade state
      ansible.builtin.meta: end_host
      when: not mgn_state_stat.stat.exists

    - name: Run kernel-grub-reset script
      ansible.builtin.command: "{{ remote_script_dir }}/kernel-grub-reset.sh"
      register: grub_reset_result
      changed_when: "'GRUB reset complete' in grub_reset_result.stdout"

    - name: Reboot after GRUB reset
      ansible.builtin.reboot:
        reboot_timeout: 300
        post_reboot_delay: 90
        msg: "Rebooting to activate reset GRUB default"
      when: grub_reset_result is changed

    - name: Run revert script
      ansible.builtin.command: "{{ remote_script_dir }}/revert.sh"
      register: revert_result
      changed_when: "'Revert complete' in revert_result.stdout"

    - name: Reboot after revert
      ansible.builtin.reboot:
        reboot_timeout: 300
        post_reboot_delay: 90
        msg: "Rebooting after kernel revert"
      when: revert_result is changed

    - name: Check kernel version
      ansible.builtin.command: uname -a
      register: uname_out
      changed_when: false

    - name: Show kernel version
      ansible.builtin.debug:
        msg: "{{ uname_out.stdout }}"
